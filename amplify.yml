version: 1
backend:
  phases:
    build:
      commands:
        # npm install en vez de npm ci: las librerias de Amplify traen una
        # inconsistencia en @opentelemetry/core que hace fallar a npm ci
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
